[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garment-grader-industrial"
version = "0.1.0"
description = "Production-shaped edge CV pipeline for garment grading and routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6,<7",
  "prometheus-client>=0.20,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
roboflow = ["inference-sdk>=0.50"]
supabase = ["supabase>=2.10"]
modal = ["modal>=1.0"]
model = ["torch>=2.4", "timm>=1.0", "onnx>=1.16"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]
all = ["inference-sdk>=0.50", "supabase>=2.10", "modal>=1.0", "torch>=2.4", "timm>=1.0", "onnx>=1.16", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
